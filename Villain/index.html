<!DOCTYPE html>

</head>
<body class="m-0 p-0 w-screen h-screen overflow-hidden font-['Cinzel'] cursor-[url('../villain_icon/cursor1.png')_0_0,auto] bg-[url('../villain_icon/bg.png')] bg-[length:100%_100%] bg-no-repeat">

        <img src="../villain_icon/logo.png" class="absolute -top-5 left-5 w-40">
    <nav class="flex gap-10 text-[#D6A84F] font-bold tracking-wider">

    <a href="../index.html" 
       class="px-5 py-3 border-b-2 border-transparent hover:border-amber-400 transition duration-1000 ease-linear cursor-[url('../villain_icon/cursor1.png')_0_0,auto]">
        HOME
    </a>

    <a href="../Legends/index.html" 
       class="px-5 py-3 border-b-2 border-transparent hover:border-amber-400 transition duration-1000 ease-linear cursor-[url('../villain_icon/cursor1.png')_0_0,auto]">
        THE LEGENDS
    </a>

    <a href="../Avatars/index.html" 
       class="px-5 py-3 border-b-2 border-transparent hover:border-amber-400 transition duration-1000 ease-linear cursor-[url('../villain_icon/cursor1.png')_0_0,auto]">

    </a>

    <a href="../About/index.html" 
       class="px-5 py-3 border-b-2 border-transparent hover:border-amber-400 transition duration-1000 ease-linear cursor-[url('../villain_icon/cursor1.png')_0_0,auto]">
        ABOUT
    </a>
    </nav>
    </header>
    
    <main class="w-full h-[calc(100vh-100px)] flex items-end">
    <div class="w-1/2 h-full flex flex-col">
    <!-- Left empty space -->
     <div  class="relative top-[27px] left-[230px]">

        <h2 class="text-[#C4B98A] text-xl font-bold tracking-[0.35em]">
            THE VILLAIN
        </h2>
        
    </div>
    <div class="relative top-[15px] left-[100px]">
        <img src="../villain_icon/jurgen.png" alt="Jurgen" class="w-[450px] h-auto">
    </div>
    <div class="pl-[210px] -mt-[30px]">
            <img src="../villain_icon/icon.png" alt="The Brutal" class="w-[250px] h-auto">
    </div>
    <div class="relative top-[-10px] left-[200px]">
    <p class="text-[#C4B98A] text-sm font-semibold tracking-[0.3em]">
        THE HUNTER OF JUMANJI
    </p>
    </div>

     <div class="relative top-[30px] left-[105px]">
        <img src="../villain_icon/icon1.png" alt="Role" class="w-[75px] h-auto">
    </div>

    <div class="absolute top-[385px] left-[220px]">
    <h3 class="text-[#D6A84F] text-[18px] font-bold">
        ROLE
    </h3>

    <p class="text-[#E5D8B0] text-[16px] mt-1 whitespace-nowrap">
        Hunter • Warlord • Antagonist
    </p>
    </div>

    <div class="absolute top-[470px] left-[220px]">
    <h3 class="text-[#D6A84F] text-[18px] font-bold">
        STRENGTH
    </h3>

    <p class="text-[#E5D8B0] text-[16px] mt-1 whitespace-nowrap">
        Power • Combat • Leadership
    </p>
    </div>

    <div class="absolute top-[560px] left-[220px]">
    <h3 class="text-[#D6A84F] text-[18px] font-bold">
        WEAKNESS
    </h3>

    <p class="text-[#E5D8B0] text-[16px] mt-1 whitespace-nowrap">
        THE JAGUAR'S HEART
    </p>
    </div>
    <div class="relative top-[50px] left-[110px]">
        <img src="../villain_icon/icon2.png" alt="Role" class="w-[65px] h-auto">
    </div>
    <div class="relative top-[80px] left-[110px]">
        <img src="../villain_icon/icon3.png" alt="Role" class="w-[65px] h-auto">
    </div>
    </div>
    

    <!-- Right side hunter -->
    <div class="w-1/2 flex justify-center items-end pb-4 group">

        <img src="../villain_icon/character.png" alt="The Brutal" class="w-[1000px] h-[700px] max-w-none -translate-x-48
                transition-all
                duration-500
                ease-out
                group-hover:scale-110
                group-hover:-translate-y-3
                cursor-[url('../villain_icon/cursor1.png')_0_0,auto]">

    </div>

    </main>
    
    <footer class="w-full flex justify-center relative top-[-100px] left-[-520px]">
    <p class="text-[#C4B98A] text-[14px] font-semibold tracking-[0.35em]">
        POWER&nbsp;&nbsp;•&nbsp;&nbsp;FEAR&nbsp;&nbsp;•&nbsp;&nbsp;NO MERCY
    </p>
    </footer>
    <audio src="../assets/videoplayback.weba" autoplay></audio>
